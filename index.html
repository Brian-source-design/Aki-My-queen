<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Queen ❤️</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            color: #d32f2f;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            /* Puppy and Flower themed background */
            background: linear-gradient(rgba(255, 192, 203, 0.6), rgba(255, 192, 203, 0.6)), 
                        url('https://images.unsplash.com/photo-1591160674255-fc809b1ed7f1?auto=format&fit=crop&q=80&w=1000');
            background-size: cover;
            background-position: center;
        }

        /* Falling Hearts Animation */
        .heart {
            position: absolute;
            top: -10%;
            color: #ff4081;
            font-size: 20px;
            user-select: none;
            z-index: -1;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(110vh); }
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 85%;
            max-width: 400px;
            border: 3px solid #ff80ab;
            position: relative;
            z-index: 1;
        }

        h1 { font-size: 1.8rem; margin-bottom: 10px; line-height: 1.2; }
        p { font-size: 1.1rem; color: #555; }
        
        button {
            padding: 12px 25px;
            font-size: 1rem;
            margin: 10px;
            cursor: pointer;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            transition: 0.3s;
        }

        .yes-btn { background-color: #ff4081; color: white; }
        .no-btn { background-color: #fce4ec; color: #ff4081; border: 1px solid #ff4081; }
        
        /* Promise Buttons - Removed color names from text */
        .promise-pink { background-color: #ff80ab; color: white; }
        .promise-blue { background-color: #4fc3f7; color: white; }
        
        .back-btn { background-color: #eeeeee; color: #757575; font-size: 0.8rem; padding: 8px 15px; margin-top: 20px; }
        
        button:hover { transform: scale(1.05); }

        .hidden { display: none; }
        .basket { font-size: 80px; cursor: pointer; display: block; margin: 15px 0; animation: bounce 2s infinite; }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .music-
